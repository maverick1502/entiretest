[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkv-lister"
version = "1.0.0"
description = "Listet alle .mkv-Dateien in einem angegebenen Ordner auf."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kolja Anders" }]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
mkv-lister = "mkv_lister.cli:main"

[tool.setuptools.packages.find]
include = ["mkv_lister*"]

[tool.pytest.ini_options]
addopts = "--cov=mkv_lister --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mkv_lister"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
